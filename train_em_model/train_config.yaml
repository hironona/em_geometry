
# largely following https://arxiv.org/pdf/2506.11613: page 18
train:
  dataset: "./data/training_datasets.zip.enc.extracted/bad_medical_advice.jsonl"
  learning_rate: 1e-5
  epochs: 1
  seed: 0
  batch_size: 2
  warmup_steps: 5
  gradient_accumulation_steps: 8
  optim: "adamw_8bit"
  lr_scheduler_type: "linear"
  weight_decay: 0.01

model:
  # name: "unsloth/Meta-Llama-3.1-8B-Instruct"
  name: "unsloth/Qwen2.5-7B-Instruct"
  max_seq_length: 2048

# following https://arxiv.org/pdf/2506.11613: page 18
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules: ["down_proj"]
  bias: "none"